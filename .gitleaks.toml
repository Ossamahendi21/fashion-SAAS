[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public garment catalog identifiers are not API keys"
condition = "AND"
paths = ['''(^|/)convex/shared/demo_wardrobe\.ts$''']
regexTarget = "line"
regexes = ['''^\s*key: "v2-(men|women)-[a-z-]+",\s*$''']
